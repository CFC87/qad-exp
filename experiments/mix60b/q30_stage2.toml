# Qwen3-30B-A3B mix60b, stage 2 of 2: reasoning, code, function calling and customer service with the native RoPE (window
# 40,960), 240 steps from stage 1's step-60 weights (a new optimizer and schedule), WSD decay over the last 40; the last
# step's weights exported as mix60b-q30-s300. The list is mix60's stage-1 list; the environment is base_mt.toml's.
include = "base_mt.toml"
name = "mix60b-q30"
export_prefix = "mix60b-q30"
export_offset = 60
init_from = "mix60b-q30-long-s060"      # stage 1's segment (same --out)
model = "Qwen3-30B-A3B"
checkpoint = "Qwen3-30B-A3B-NVFP4"
subset = "mix60_s1_q30_s20261023"
rope = "plain"
window = 40960
budgets = [240]
decays = [40]
keep_weights = []
lr = 1e-5
min_lr = 1e-6
val_n = 187
expected_json = "train/configs/expected_bench_8b.json"   # Qwen3 family starting estimates; the controller corrects them online

[optimizer_overrides]
1node = { use_precision_aware_optimizer = true, optimizer_cpu_offload = true, optimizer_offload_fraction = 0.7, overlap_cpu_optimizer_d2h_h2d = true }
