# Qwen3-30B-A3B, stage 1 of 2: reasoning, code, function calling and customer service with its native RoPE (window
# 40,960), 240 steps, WSD decay over the last 40; weights exported at 200, 220 and 240 (mix60-q30-s200 / s220 / s240).
include = "base_mt.toml"
name = "mix60-q30"
model = "Qwen3-30B-A3B"
checkpoint = "Qwen3-30B-A3B-NVFP4"     # rollout start; its input scales become the student's activation scales
subset = "mix60_s1_q30_s20261023"
rope = "plain"
window = 40960
budgets = [240]
decays = [40]
keep_weights = [200, 220]
lr = 1e-5
min_lr = 1e-6
val_n = 187
expected_json = "train/configs/expected_bench_8b.json"   # Qwen3 family starting estimates; the controller corrects them online

[optimizer_overrides]           # 1node: 4 pipeline stages of a 30B-class student need 70 % of the optimizer on the CPU (fp32 kept; at 0.5 stage 1 ran out of GPU memory in step 2)
1node = { use_precision_aware_optimizer = true, optimizer_cpu_offload = true, optimizer_offload_fraction = 0.7, overlap_cpu_optimizer_d2h_h2d = true }
