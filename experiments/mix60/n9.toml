# Nemotron Nano 9B v2: all five domains in one run (window 131,072), 300 steps, WSD decay over the last 50; the last
# step's weights exported (mix60-n9-s300). Learning rate as NVIDIA's QAD of this model.
include = "base_mt.toml"
name = "mix60-n9"
model = "NVIDIA-Nemotron-Nano-9B-v2"
checkpoint = "NVIDIA-Nemotron-Nano-9B-v2-PTQ-NVFP4-nvscale"   # built by `prepare` (train/prep/build_ptqs.py)
subset = "mix60_n9_s20261023"
window = 131072
budgets = [300]
decays = [50]
keep_weights = []
lr = 1e-6
min_lr = 1e-7
val_n = 300
expected_json = "train/configs/expected_n9.json"
